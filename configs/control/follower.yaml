# Параметры follower_node (Фаза 3). ros2-params формат, грузится launch-файлом
# (drone_bringup/launch/follower_demo.launch.py). Источник истины по управлению —
# этот файл (§7 CLAUDE.md: конфиги отдельно от кода, без магических чисел).
follower_node:
  ros__parameters:
    loop_rate_hz: 20.0                # частота offboard-цикла (>2 Гц обязательно, иначе срыв)
    target_topic: /perception/target  # вход: цель от детектора (drone_interfaces/Target)

    # Высота и взлёт.
    target_altitude_m: 2.5            # целевая высота полёта (P-регулятор сам выполнит взлёт)
    min_follow_altitude_m: 1.0        # ниже этой высоты горизонтальное слежение выключено
    arm_after_s: 2.0                  # сколько стримить setpoint'ы до offboard+arm (порядок §5)
    target_timeout_s: 0.5             # старше — цель считается потерянной (hover)

    # P-коэффициенты.
    kp_yaw: 1.2                       # offset_x → yaw-rate
    # kp_forward — усиление forward-канала. 18 (не 3!): area_ratio наземной цели при
    # горизонтальной камере на 2.5 м мал (~0.006–0.028), а area~1/d² нелинеен → на этих
    # мелких величинах ошибки крошечные, и kp=3 давал мизерную скорость (дрон не подъезжал).
    # 18 масштабирует отклик под реальные величины area инкр. 4B. (Нелинейность area как
    # прокси дистанции — известное упрощение; линейный прокси ~1/√area — задача Фазы 4.)
    kp_forward: 18.0                  # (area_target - area_ratio) → скорость вперёд/назад
    kp_altitude: 1.0                  # ошибка высоты → вертикальная скорость
    # area_target — желаемая доля кадра под bbox (прокси дистанции). 0.02 (не 0.15!):
    # камера смотрит ГОРИЗОНТАЛЬНО с target_altitude=2.5 м, цель наземная → ближе ~3 м
    # человек уходит из нижнего края кадра (offset_y→край), area_ratio упирается в ~0.028.
    # 0.02 = держаться чуть СНАРУЖИ этой геометрической стены (~3.5 м), где человек ещё
    # целиком в кадре. 0.15 недостижимо для этой геометрии/меша (ходячий actor). Для
    # крупного статичного меша (4A, Standing person) 0.15 было достижимо.
    area_target: 0.02

    # M3 (Ф4-5/Ф4-6): forward-канал по ЧЕСТНОЙ дистанции (метры). Работает, когда детектор
    # даёт distance_m>0 (наклонённая камера + pinhole); иначе откат на area-прокси выше.
    distance_target_m: 4.0            # желаемый стендофф до цели, метры (наклон камеры вниз держит цель в кадре)
    kp_distance: 0.5                  # (distance - distance_target) [м] → скорость вперёд/назад [м/с]
    distance_deadband_m: 0.3          # |ошибка дистанции| ниже — не едем (фильтр шума оценки)
    # Guard кадрирования: цель ниже offset_y_backoff (близко к нижнему краю при наклоне вниз)
    # → форсируем откат назад со скоростью backoff_speed, чтобы цель не выпала из кадра.
    offset_y_backoff: 0.8             # порог offset_y [-1..1]; >0.8 = у нижнего края
    backoff_speed: 0.6                # м/с назад при срабатывании guard

    # Лимиты скоростей (безопасность + плавность).
    max_yaw_rate: 0.6                 # рад/с
    max_forward_speed: 1.5            # м/с
    max_vertical_speed: 1.0           # м/с

    # Мёртвые зоны — не реагировать на мелкие ошибки (дрожание bbox).
    yaw_deadband: 0.05                # |offset_x| ниже — не доворачиваем
    area_deadband: 0.004              # |area_err| ниже — не едем (было 0.02 — «съедало» весь
                                      # полезный сигнал при мелких area наземной цели, форвард
                                      # не включался; 0.004 фильтрует лишь дрожание bbox)

    # M2 (Ф4-7/Ф4-11): поведение при потере цели. Вместо «нет цели → висим» (Фаза 3) —
    # FSM TAKEOFF/TRACK/LOST/SEARCH. LOST: короткий доворот туда, где цель видели последней
    # (чаще всего она просто ушла за край кадра). SEARCH: медленное вращение на месте,
    # БЕССРОЧНО — дрон ждёт ИМЕННО своего человека; подмена чужим невозможна, её отсекает
    # ReID-гейт в детекторе. Выход из бессрочного SEARCH в RTL по таймауту — задача M5.
    # Три фазы потери цели, по нарастанию активности — каждая следующая рискованнее.
    hold_after_loss_s: 2.0            # 1) HOLD: ЗАМЕРЕТЬ, курс не менять. Самая частая причина
                                      # потери — цель пересеклась с другим человеком и скрылась
                                      # на пару секунд. Доворот в этот момент отворачивает нас
                                      # от неё же: она вернётся туда, куда мы уже не смотрим
    lost_hold_s: 2.0                  # 2) LOST: доворот к последнему направлению — цель, похоже,
                                      # ушла за край кадра, доворот вернёт её в поле зрения
                                      # 3) дальше SEARCH: вращение на месте, бессрочно (Ф4-11)
    initial_hold_s: 5.0               # ДО первого захвата фаза LOST пропускается (доворачивать
                                      # некуда): дрон висит столько секунд, потом сразу SEARCH.
                                      # Раньше он крутился сразу и успевал сделать полный оборот,
                                      # прежде чем заметить человека, уже стоявшего перед ним

    # Гейт ПЕРВОГО слежения: пока дрон не вышел на target_altitude_m (с этим допуском),
    # горизонтальное преследование не начинается — иначе он стартовал на середине набора и
    # летел за человеком слишком низко. Дальше проверка отключается: слежение не должно
    # прерываться из-за того, что дрон немного просел в манёвре.
    follow_altitude_tolerance_m: 0.1
    search_yaw_rate: 0.35             # рад/с в LOST и SEARCH. Медленнее max_yaw_rate: быстрое
                                      # вращение смазывает кадр и мешает и детекции, и ReID

    # Знаки осей (frame-неоднозначность). Если в симуляторе доворот/ход идёт В ПРОТИВО-
    # ПОЛОЖНУЮ сторону — поменять соответствующий знак на -1.0 (без правки кода, §Ф3-5).
    yaw_sign: 1.0
    forward_sign: 1.0
