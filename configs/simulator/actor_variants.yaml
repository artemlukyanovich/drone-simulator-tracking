# Облик ходячих actor'ов мира follow_crowd.sdf (Фаза 4, Ф4-12).
#
# ЗАЧЕМ. Исходный меш Fuel `Mingfei/actor/walk.dae` один на всех троих → люди в кадре
# ПОПИКСЕЛЬНО одинаковы, и ре-идентификация (Ф4-13) физически не имеет сигнала: любой
# дескриптор, включая обученный эмбеддинг, сравнивал бы три идентичные картинки (риск R7).
# Здесь каждому человеку задаётся свой облик по ДВУМ независимым осям:
#   1) цвет одежды — свитер и джинсы отдельно (различает «похожую гамму», а не только «красный/зелёный»);
#   2) рост (scale) — ось, которую цветом не подделать; в ReID даёт подтверждение,
#      независимое от освещения и ракурса.
#
# КАК ПРИМЕНЯЕТСЯ. `scripts/make_actor_variants.py` читает базовый меш (кэш Fuel) и
# пишет вендорные копии в `src/drone_simulator/models/actor_<key>/meshes/walk.dae`,
# подменяя <diffuse> у именованных материалов COLLADA (`sweater-green`, `jeans-blue`).
# Меш НЕ текстурирован — цвета лежат прямо в файле, поэтому перекраска возможна без графики.
# Мир ссылается на `model://actor_<key>/meshes/walk.dae` (GZ_SIM_RESOURCE_PATH из run_px4_sitl.sh).
#
# ⚠️ СВЯЗКА С ДИСТАНЦИЕЙ (риск R6). Pinhole-оценка M3 считается по РОСТУ ЦЕЛИ
# (`h_real_m` в configs/perception/detector.yaml). Поэтому у цели scale=1.0 намеренно
# оставлен без изменений — `h_real_m: 1.7` остаётся верным и M3 не требует ретюна.
# Если когда-нибудь поменяешь scale ЦЕЛИ — синхронно правь `h_real_m`, иначе тихо
# поедет вся дистанция, а с ней forward-канал.
#
# Цвет — linear RGB [0..1], как в COLLADA (не sRGB-байты). Альфа добавляется генератором.

actors:
  target:
    description: ЦЕЛЬ — красный свитер, тёмно-синие джинсы, рост эталонный
    sweater: [0.72, 0.06, 0.05]     # насыщенный красный: максимально далёк по hue от обоих дистракторов
    jeans:   [0.05, 0.07, 0.22]     # тёмно-синий (близко к исходному) — низ у цели тёмный
    scale:   1.0                     # НЕ менять без правки h_real_m (см. R6 выше)

  distractor_a:
    description: ДИСТРАКТОР 1 — жёлтый свитер, тёмно-зелёные джинсы, ниже цели
    sweater: [0.85, 0.72, 0.05]     # жёлтый
    jeans:   [0.06, 0.16, 0.07]     # тёмно-зелёный: низ отличается и от цели, и от второго дистрактора
    scale:   0.92                    # ≈1.56 м — заметно ниже цели

  distractor_b:
    description: ДИСТРАКТОР 2 — голубой свитер, светло-серые джинсы, выше цели
    sweater: [0.06, 0.42, 0.80]     # голубой
    jeans:   [0.55, 0.57, 0.60]     # светло-серый: единственный СВЕТЛЫЙ низ в сцене
    scale:   1.08                    # ≈1.84 м — заметно выше цели
