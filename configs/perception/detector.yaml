# Параметры detector_node (Фаза 3). ros2-params формат: грузится launch-файлом
# (drone_bringup/launch/detector_demo.launch.py). Источник истины по настройкам
# перцепции — этот файл (§7 CLAUDE.md: конфиги отдельно от кода).
detector_node:
  ros__parameters:
    # Топики.
    image_topic: /camera/image          # вход: камера дрона (sensor_msgs/Image, rgb8)
    camera_info_topic: /camera/camera_info  # вход: intrinsics (f_y для pinhole-дистанции, M3)
    target_topic: /perception/target     # выход: цель (drone_interfaces/Target)
    annotated_topic: /perception/image    # выход: кадр с bbox (для глаз)
    publish_annotated: true               # рисовать и публиковать /perception/image

    # Модель YOLO. Путь относителен корня проекта (откуда запускаем команды),
    # либо укажи абсолютный путь. Если файла нет — ultralytics скачает по имени.
    # Веса в git не коммитятся (*.pt в .gitignore); локальная копия — models/yolov8n.pt.
    model_path: models/yolov8n.pt
    confidence_threshold: 0.5             # порог уверенности детекции
    device: cuda                          # cuda | cpu (при отсутствии GPU — авто-откат на cpu)

    # Цель слежения.
    target_classes: ['person']            # COCO-классы цели; [] = любой класс
    selection: largest                    # detect-only fallback: largest (крупнейший bbox) | closest (ближе к центру)

    # Трекинг (Фаза 4, M1 / Ф4-1). tracking:true → ByteTrack поверх YOLO даёт стабильный
    # track_id между кадрами; захват — крупнейший подтверждённый трек, далее держим его id
    # (политика lock в detector_node, Ф4-2). tracking:false → detect-only режим Фазы 3.
    tracking: true
    tracker: bytetrack.yaml               # конфиг трекера ultralytics: bytetrack.yaml | botsort.yaml (ReID, запас R1)
    debug_tracking: false                 # true → лог dets/ids/locked/matched (1 Гц) для разбора поведения трекера

    # Честная дистанция (Фаза 4, M3 / Ф4-5): distance_m = f_y·H_real/h_px.
    h_real_m: 1.7                         # известный рост цели (actor), метры — база pinhole-оценки
    distance_ema_alpha: 0.4               # сглаживание EMA (0..1]; 1.0 = без сглаживания, меньше = плавнее (R2)
    distance_edge_margin_px: 3            # bbox ближе этого к краю кадра → дистанции не доверяем (срез → завышение, R2)
