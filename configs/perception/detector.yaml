# Параметры detector_node (Фаза 3). ros2-params формат: грузится launch-файлом
# (drone_bringup/launch/detector_demo.launch.py). Источник истины по настройкам
# перцепции — этот файл (§7 CLAUDE.md: конфиги отдельно от кода).
detector_node:
  ros__parameters:
    # Топики.
    image_topic: /camera/image          # вход: камера дрона (sensor_msgs/Image, rgb8)
    camera_info_topic: /camera/camera_info  # вход: intrinsics (f_y для pinhole-дистанции, M3)
    target_topic: /perception/target     # выход: цель (drone_interfaces/Target)
    annotated_topic: /perception/image    # выход: кадр с bbox (для глаз)
    publish_annotated: true               # рисовать и публиковать /perception/image

    # Модель YOLO. Путь относителен корня проекта (откуда запускаем команды),
    # либо укажи абсолютный путь. Если файла нет — ultralytics скачает по имени.
    # Веса в git не коммитятся (*.pt в .gitignore); локальная копия — models/yolov8n.pt.
    model_path: models/yolov8n.pt
    confidence_threshold: 0.5             # порог уверенности детекции
    device: cuda                          # cuda | cpu (при отсутствии GPU — авто-откат на cpu)

    # Цель слежения.
    target_classes: ['person']            # COCO-классы цели; [] = любой класс
    selection: largest                    # detect-only fallback: largest (крупнейший bbox) | closest (ближе к центру)

    # Трекинг (Фаза 4, M1 / Ф4-1). tracking:true → ByteTrack поверх YOLO даёт стабильный
    # track_id между кадрами; захват — крупнейший подтверждённый трек, далее держим его id
    # (политика lock в detector_node, Ф4-2). tracking:false → detect-only режим Фазы 3.
    tracking: true
    tracker: bytetrack.yaml               # конфиг трекера ultralytics: bytetrack.yaml | botsort.yaml (ReID, запас R1)
    debug_tracking: false                 # true → лог dets/ids/locked/matched (1 Гц) для разбора поведения трекера

    # Честная дистанция (Фаза 4, M3 / Ф4-5): distance_m = f_y·H_real/h_px.
    h_real_m: 1.7                         # известный рост цели (actor), метры — база pinhole-оценки
    horizontal_fov_rad: 1.74              # FOV камеры (из mono_cam SDF) — f_y, если camera_info не пришёл
    distance_ema_alpha: 0.4               # сглаживание EMA (0..1]; 1.0 = без сглаживания, меньше = плавнее (R2)
    distance_edge_margin_px: 3            # bbox ближе этого к краю кадра → дистанции не доверяем (срез → завышение, R2)

    # --- Ре-идентификация цели (Фаза 4, M2 / Ф4-13) ---
    # ЗАЧЕМ. track_id от ByteTrack временный: после окклюзии трек умирает и человек
    # возвращается с НОВЫМ id. Эмбеддинг OpenCLIP даёт постоянный «облик» цели, по которому
    # мы узнаём именно СВОЕГО человека. Не узнали — не берём никого (Ф4-11): дрон уходит в
    # бессрочный поиск, но никогда не сопровождает чужого.
    reid:
      enabled: true                       # false → поведение M1 (потерял трек — потерял цель)
      # Модель. Веса (~350 МБ) качаются при первом запуске в кэш Torch Hub, в git не идут.
      model_name: ViT-B-32
      pretrained: laion2b_s34b_b79k
      device: cuda                        # cuda | cpu (авто-откат на cpu, если CUDA нет)

      # ПОРОГ — главная ручка строгости. Выше = строже: реже ложный перезахват на чужого,
      # но и дольше поиск своего. По Ф4-11 ошибка «взял чужого» дороже ошибки «не нашёл»,
      # поэтому держим высоко. ⚠️ Подбирается по факту: включи reid.debug и посмотри, какие
      # баллы даёт СВОЙ человек при возврате и какие — дистракторы; порог ставь между ними.
      similarity_threshold: 0.90

      # Эталон облика: буфер разных ракурсов (человек поворачивается — вид со спины ≠ анфас).
      max_embeddings: 5                   # сколько ракурсов помним
      aggregation: mean                   # mean | ema | recent | weighted (как в project_1)
      ema_alpha: 0.3                      # для aggregation: ema
      recent_n: 3                         # для aggregation: recent
      weighted_decay: 0.7                 # для aggregation: weighted

      # СКВАЖНОСТЬ (Ф4-15, риск R4): эмбеддер делит GPU с YOLO и рендером Gazebo, поэтому
      # он НЕ работает каждый кадр — в отличие от project_1, где это офлайн-видео.
      refresh_every_n_frames: 15          # как часто подпитывать эталон, пока цель ведётся (0 = никогда)
      relock_check_interval_s: 0.4        # как часто сверять кандидатов, пока цель потеряна

      crop_padding_px: 6                  # поле вокруг bbox: YOLO часто режет по краю одежды
      min_bbox_height_px: 40              # мельче — облик недостоверен; такие кандидаты не сверяем
                                          # (в т.ч. НА ПЕРВИЧНОМ ЗАХВАТЕ: эталон, снятый с
                                          # крошечной фигуры на взлёте, ни с чем потом не совпадал)
      # Лок сначала ПРЕДВАРИТЕЛЬНЫЙ. Строгий запрет подмены цели (Ф4-11) включается только
      # после непрерывного слежения confirm_after_s — до этого мы ещё никого по-настоящему
      # не выбрали, и потеря трека разрешает захватить заново. Без этого один неудачный
      # эталон запирал дрона навсегда (прогон 2026-07-18).
      confirm_after_s: 3.0
      debug: false                        # true → лог баллов ПО КАЖДОМУ кандидату (id, высота bbox, балл)
